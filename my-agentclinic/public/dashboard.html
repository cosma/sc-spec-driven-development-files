<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - AgentClinic</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .dashboard-tabs {
      display: flex;
      border-bottom: 2px solid var(--gray-200);
      gap: 0;
      margin-bottom: 2rem;
    }

    .dashboard-tabs button {
      padding: 1rem 1.5rem;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      color: var(--gray-600);
      transition: all 0.2s ease;
    }

    .dashboard-tabs button:hover {
      color: var(--gray-900);
    }

    .dashboard-tabs button.active {
      color: var(--primary-color);
      border-bottom-color: var(--primary-color);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .profile-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
      margin-bottom: 2rem;
    }

    .profile-section {
      background-color: var(--white);
      padding: 1.5rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
    }

    .wellness-status {
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
      padding: 1.5rem;
      border-radius: var(--radius);
      border-left: 4px solid var(--primary-color);
    }

    .search-box {
      margin-bottom: 1.5rem;
    }

    .search-box input {
      width: 100%;
      max-width: 400px;
    }

    .filter-buttons {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }

    .filter-btn {
      padding: 0.5rem 1rem;
      background-color: var(--white);
      border: 1px solid var(--gray-300);
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 0.875rem;
      transition: all 0.2s ease;
    }

    .filter-btn:hover {
      border-color: var(--primary-color);
      color: var(--primary-color);
    }

    .filter-btn.active {
      background-color: var(--primary-color);
      color: var(--white);
      border-color: var(--primary-color);
    }

    .therapy-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .therapy-card {
      background-color: var(--white);
      padding: 1.5rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      border-left: 4px solid var(--primary-color);
    }

    .therapy-card h4 {
      margin-bottom: 0.5rem;
    }

    .therapy-card p {
      font-size: 0.875rem;
      color: var(--gray-600);
      margin-bottom: 1rem;
    }

    .therapy-meta {
      font-size: 0.875rem;
      color: var(--gray-600);
      margin-bottom: 1rem;
    }

    .appointment-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .appointment-item {
      background-color: var(--white);
      padding: 1.5rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      border-left: 4px solid var(--primary-color);
    }

    .appointment-item h4 {
      margin-bottom: 0.5rem;
    }

    .appointment-meta {
      font-size: 0.875rem;
      color: var(--gray-600);
      margin: 0.5rem 0;
    }

    .appointment-status {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      background-color: var(--gray-100);
      border-radius: var(--radius);
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--primary-color);
      text-transform: capitalize;
      margin-top: 0.5rem;
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1.5rem;
      color: var(--gray-600);
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background-color: var(--white);
      border-radius: var(--radius);
      padding: 2rem;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    }

    .modal-header {
      margin-bottom: 1.5rem;
    }

    .modal-form {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .modal-actions {
      display: flex;
      gap: 1rem;
      justify-content: flex-end;
    }

    .modal-actions button {
      padding: 0.5rem 1rem;
    }
  </style>
</head>
<body>
  <script src="layout.js"></script>

  <div class="app-main">
    <!-- Dashboard Tabs -->
    <div class="dashboard-tabs">
      <button class="active" data-tab="profile">Profile</button>
      <button data-tab="therapies">Browse Therapies</button>
      <button data-tab="appointments">My Appointments</button>
    </div>

    <!-- Profile Tab -->
    <div id="profile" class="tab-content active">
      <div class="profile-grid">
        <div class="profile-section">
          <h3>Account Information</h3>
          <div class="form-group">
            <label>Name</label>
            <p id="profileName" style="font-size: 1.125rem; color: var(--gray-900);">Loading...</p>
          </div>
          <div class="form-group">
            <label>Agent ID</label>
            <p id="profileId" style="font-size: 0.875rem; color: var(--gray-700); font-family: monospace;">Loading...</p>
          </div>
        </div>

        <div class="profile-section">
          <h3>Wellness Status</h3>
          <div class="wellness-status">
            <p>You're doing great! Keep up with your wellness routine.</p>
            <p style="font-size: 0.875rem; color: var(--gray-600); margin-top: 1rem;">
              Next appointment: <span id="nextAppointment" style="font-weight: 600;">No appointments yet</span>
            </p>
          </div>
        </div>
      </div>
    </div>

    <!-- Therapies Tab -->
    <div id="therapies" class="tab-content">
      <div class="search-box">
        <input type="text" id="searchTherapies" placeholder="Search therapies..." style="max-width: 400px;">
      </div>

      <div class="filter-buttons" id="therapyFilter">
        <button class="filter-btn active" data-filter="">All</button>
      </div>

      <div class="therapy-grid" id="therapyList">
        <div class="empty-state">Loading therapies...</div>
      </div>
    </div>

    <!-- Appointments Tab -->
    <div id="appointments" class="tab-content">
      <h2>My Appointments</h2>
      <div class="appointment-list" id="appointmentList">
        <div class="empty-state">Loading appointments...</div>
      </div>
    </div>
  </div>

  <!-- Book Appointment Modal -->
  <div id="bookModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Book Appointment</h3>
      </div>
      <form id="bookForm" class="modal-form">
        <div class="form-group">
          <label>Therapy</label>
          <p id="therapyName" style="font-weight: 600; color: var(--gray-900);"></p>
        </div>

        <div class="form-group">
          <label for="appointmentDate">Date & Time</label>
          <input type="datetime-local" id="appointmentDate" required>
        </div>

        <div class="form-group">
          <label for="appointmentNotes">Notes (Optional)</label>
          <textarea id="appointmentNotes" style="padding: 0.5rem 0.75rem; border: 1px solid var(--gray-300); border-radius: var(--radius); font-family: inherit;" rows="3" placeholder="Any notes for the therapist..."></textarea>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-secondary" onclick="document.getElementById('bookModal').classList.remove('active')" style="background-color: var(--gray-300); color: var(--gray-900);">Cancel</button>
          <button type="submit" class="btn-primary">Book Appointment</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:3000';
    let currentTherapyId = null;

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      const auth = checkAuthStatus();
      if (!auth.isAuthenticated) {
        window.location.href = 'login.html';
        return;
      }

      initializeLayout({
        isAuthenticated: true,
        userName: auth.name,
        page: 'dashboard'
      });

      // Set profile info
      document.getElementById('profileName').textContent = auth.name;
      document.getElementById('profileId').textContent = auth.agentId;

      // Setup tabs
      document.querySelectorAll('.dashboard-tabs button').forEach(btn => {
        btn.addEventListener('click', () => {
          const tabName = btn.dataset.tab;
          switchTab(tabName);
        });
      });

      // Load data
      loadTherapies();
      loadAppointments();
    });

    function switchTab(tabName) {
      document.querySelectorAll('.dashboard-tabs button').forEach(btn => {
        btn.classList.remove('active');
      });
      document.querySelectorAll('.tab-content').forEach(tab => {
        tab.classList.remove('active');
      });

      document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');
      document.getElementById(tabName).classList.add('active');
    }

    function getAuthHeaders() {
      return {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${localStorage.getItem('token')}`
      };
    }

    async function loadTherapies() {
      try {
        const response = await fetch(`${API_URL}/therapies`);
        const therapies = await response.json();

        const filterEl = document.getElementById('therapyFilter');
        filterEl.innerHTML = '<button class="filter-btn active" data-filter="">All</button>';

        const ailments = new Set();
        therapies.forEach(t => t.ailments?.forEach(a => ailments.add(a.category)));
        ailments.forEach(category => {
          const btn = document.createElement('button');
          btn.className = 'filter-btn';
          btn.textContent = category;
          btn.dataset.filter = category;
          filterEl.appendChild(btn);
        });

        document.querySelectorAll('.filter-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
          });
        });

        const list = document.getElementById('therapyList');
        list.innerHTML = '';
        therapies.forEach(therapy => {
          const div = document.createElement('div');
          div.className = 'therapy-card';
          div.innerHTML = `
            <h4>${therapy.name}</h4>
            <p>${therapy.description}</p>
            <div class="therapy-meta">
              <p><strong>Duration:</strong> ${therapy.duration} minutes</p>
              <p><strong>For:</strong> ${therapy.ailments?.map(a => a.name).join(', ') || 'General'}</p>
            </div>
            <button class="btn-primary" style="width: 100%; padding: 0.5rem;" onclick="openBookModal('${therapy.id}', '${therapy.name}')">Book Now</button>
          `;
          list.appendChild(div);
        });
      } catch (error) {
        console.error('Error loading therapies:', error);
        document.getElementById('therapyList').innerHTML = '<div class="empty-state"><p>Failed to load therapies</p></div>';
      }
    }

    async function loadAppointments() {
      try {
        const response = await fetch(`${API_URL}/appointments`, {
          headers: getAuthHeaders()
        });
        const appointments = await response.json();

        const list = document.getElementById('appointmentList');
        if (appointments.length === 0) {
          list.innerHTML = '<div class="empty-state"><p>No appointments yet. <a href="#" style="color: var(--primary-color); font-weight: 600;">Book one now!</a></p></div>';
          return;
        }

        list.innerHTML = '';
        appointments.forEach(apt => {
          const date = new Date(apt.scheduledAt);
          const div = document.createElement('div');
          div.className = 'appointment-item';
          div.innerHTML = `
            <h4>${apt.therapyName}</h4>
            <div class="appointment-meta">Scheduled: ${date.toLocaleString()}</div>
            <div class="appointment-meta">Duration: ${apt.duration} minutes</div>
            <div class="appointment-status">${apt.status}</div>
          `;
          list.appendChild(div);
        });

        if (appointments.length > 0) {
          document.getElementById('nextAppointment').textContent = new Date(appointments[0].scheduledAt).toLocaleString();
        }
      } catch (error) {
        console.error('Error loading appointments:', error);
        document.getElementById('appointmentList').innerHTML = '<div class="empty-state"><p>Failed to load appointments</p></div>';
      }
    }

    function openBookModal(therapyId, therapyName) {
      currentTherapyId = therapyId;
      document.getElementById('therapyName').textContent = therapyName;
      document.getElementById('appointmentDate').value = '';
      document.getElementById('appointmentNotes').value = '';
      document.getElementById('bookModal').classList.add('active');
    }

    document.getElementById('bookForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const response = await fetch(`${API_URL}/appointments`, {
          method: 'POST',
          headers: getAuthHeaders(),
          body: JSON.stringify({
            therapyId: currentTherapyId,
            scheduledAt: document.getElementById('appointmentDate').value,
            notes: document.getElementById('appointmentNotes').value
          })
        });

        if (!response.ok) {
          throw new Error('Failed to book appointment');
        }

        document.getElementById('bookModal').classList.remove('active');
        loadAppointments();
        alert('Appointment booked successfully!');
      } catch (error) {
        alert('Error booking appointment: ' + error.message);
      }
    });
  </script>
</body>
</html>
